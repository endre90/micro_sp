[package]
name = "micro_sp"
version = "0.1.0"
authors = ["Endre Erős <endre.eros@chalmersindustriteknik.se>"]
edition = "2024"
description = "A Sequence Planner runtime for controlling automation systems, with state kept in Redis."
repository = "https://github.com/endre90/micro_sp"
documentation = "https://endre90.github.io/micro_sp/"
readme = "README.md"
keywords = ["automation", "planning", "robotics", "control", "sequence-planner"]
categories = ["science::robotics", "simulation"]
# NOTE: `license` (or `license-file`) is required to publish on crates.io.
# e.g. license = "MIT OR Apache-2.0"

[dependencies]
nanoid = "0.4.0"
futures = "0.3"
nalgebra = "0.32.5"
termtree = "0.5.1"
chrono = { version = "0.4", features = ["serde"] }
log = { version = "0.4", features = ["serde"] }
env_logger = "0.11.5"
tokio = { version = "1", features = ["full"] }
redis = { version = "0.29.1", features = ["tokio-comp", "connection-manager"] }
ordered-float = { version = "3.4.0", features = ["serde"] }
peg = "0.8.1"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.140"

# Only used by the test suite. Kept out of `[dependencies]` so that consuming
# crates do not have to build Docker test machinery to depend on micro_sp.
[dev-dependencies]
testcontainers = "0.23.3"
testcontainers-modules = { version = "0.11.6", features = ["redis"] }
serial_test = "3.2.0"
# Used by the emulators under `examples/`. Examples build with dev-dependencies,
# so this stays off consumers' dependency graph.
rand = "0.8"
